<!DOCTYPE html>
<html>
<head>
  <title>AI Review System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="flex h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow">
    <h2 class="p-4 font-bold text-xl">Reviews</h2>
    <nav class="px-4 space-y-2">
      <a href="/reviews/" class="block p-2 rounded bg-indigo-100">Active Reviews</a>
      <a href="/reviews/archived/" class="block p-2">Archived Reviews</a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-6">
    {% block content %}{% endblock %}
  </main>

</div>

</body>
</html>
